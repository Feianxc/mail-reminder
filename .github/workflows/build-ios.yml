name: Build iOS IPA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mail-reminder-ios
  cancel-in-progress: false
jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Check model persistence and receipts
        run: |
          xcrun swiftc ios/MailReminder/Models.swift ios/checks/main.swift -o "$RUNNER_TEMP/mail-model-checks"
          "$RUNNER_TEMP/mail-model-checks"
      - name: Build and verify iPhone IPA
        run: bash ios/build_ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mail-reminder-ios-1.3.0
          path: |
            ios/output/*.ipa
            ios/output/build-result.json
          if-no-files-found: error
          retention-days: 1
      - name: Simulator launch check
        run: bash ios/simulator_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mail-reminder-ios-simulator
          path: |
            ios/output/*.png
            ios/output/simulator-result.json
          if-no-files-found: warn
          retention-days: 1
